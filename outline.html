function buildFeature(){

    const meta = esc(sc.kind||"") + (sc.lang?" &middot; "+esc(sc.lang):"") + (sc.lines?" &middot; "+sc.lines+" ln":"");

      '<span class="dot" style="background:var(--'+specClass(sc.spec)+')"></span>');

    .map(function(e){ return { from:e.from, to:e.to, label:e.label, kind:e.kind, model:e, click:true }; });

function buildScript(){
  activeNodes = [];

    (sc.members||[]).forEach(function(m){
      const meta = esc(m.kind||"") + (m.type?" &middot; "+esc(m.type):"");
      const n = makeNode(m, "member "+memberKindClass(m.kind), m.name||m.id, meta, function(nn){ openMember(nn.model); });
      activeNodes.push(n);

  // member -> member call edges; intra-script drawn always, cross only when selected
  activeEdges = [];

    (sc.members||[]).forEach(function(m){

// ---------- layout ----------
function gridPlace(ids, x0, y0, cellW, cellH, cols){
  ids.forEach(function(id, i){
    const n = nodeByModelId(id); if(!n) return;
    n.x = x0 + (i % cols) * cellW;
    n.y = y0 + Math.floor(i / cols) * cellH;
  });

}
function nodeByModelId(id){ return activeById[id]; }

const PAD = 26, GAP = 60, TITLE = 22;
function layoutFeature(){
  let cx = 0, cy = 0, rowH = 0; const MAXW = 2200, CELLW = 240, CELLH = 118;
  categories.forEach(function(cat){
    const ids = (scriptsByCat[cat.label]||[]).map(function(sc){ return sc.id; });
    if (!ids.length) return;
    const cols = Math.max(1, Math.min(4, Math.ceil(Math.sqrt(ids.length))));
    const rows = Math.ceil(ids.length / cols);
    const blockW = cols*CELLW + PAD*2, blockH = rows*CELLH + PAD*2 + TITLE;
    if (cx > 0 && cx + blockW > MAXW) { cx = 0; cy += rowH + GAP; rowH = 0; }
    gridPlace(ids, cx + PAD, cy + PAD + TITLE, CELLW, CELLH, cols);
    cx += blockW + GAP; rowH = Math.max(rowH, blockH);
  });
}
function layoutScript(){
  let y = 0; const MAXW = 3400, MCW = 168, MCH = 66, SPAD = 20, STITLE = 20, CATTITLE = 30;
  categories.forEach(function(cat){
    const cats = scriptsByCat[cat.label] || [];
    const bandScripts = cats.filter(function(sc){ return (sc.members||[]).length; });
    if (!bandScripts.length) return;
    let x = PAD, bandTop = y + CATTITLE, bandH = 0;
    bandScripts.forEach(function(sc){
      const ids = sc.members.map(function(m){ return m.id; });
      const cols = Math.max(1, Math.min(6, Math.ceil(Math.sqrt(ids.length))));
      const rows = Math.ceil(ids.length / cols);
      const scW = cols*MCW + SPAD*2, scH = rows*MCH + SPAD*2 + STITLE;
      if (x > PAD && x + scW > MAXW) { x = PAD; bandTop += bandH + GAP; bandH = 0; }
      gridPlace(ids, x + SPAD, bandTop + STITLE + SPAD, MCW, MCH, cols);
      x += scW + GAP; bandH = Math.max(bandH, scH);
    });
    y = bandTop + bandH + GAP*1.6;
  });
}

    if (e.label){
      const t=document.createElementNS(SVGNS,"text");
      t.setAttribute("class","elabel"); t.setAttribute("x",mx); t.setAttribute("y",(p.y+q.y)/2-3);
      t.setAttribute("text-anchor","middle"); t.textContent=e.label; svg.appendChild(t);
    }
  });
}

// ---------- camera ----------
function applyView(){ world.style.transform="translate("+view.x+"px,"+view.y+"px) scale("+view.k+")"; }
function fitView(){
  if (!activeNodes.length) { applyView(); return; }
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  activeNodes.forEach(function(n){ const w=n._el.offsetWidth||158,h=n._el.offsetHeight||48;
    minX=Math.min(minX,n.x); minY=Math.min(minY,n.y); maxX=Math.max(maxX,n.x+w); maxY=Math.max(maxY,n.y+h); });
  const pad=80, cw=maxX-minX+pad*2, ch=maxY-minY+pad*2, vw=window.innerWidth, vh=window.innerHeight;
  view.k=Math.min(1, vw/cw, vh/ch); view.x=(vw-cw*view.k)/2-(minX-pad)*view.k; view.y=(vh-ch*view.k)/2-(minY-pad)*view.k;
  applyView();
}
function focusNode(n, targetK){
  const w=n._el.offsetWidth||158, h=n._el.offsetHeight||48, c={x:n.x+w/2,y:n.y+h/2};
  view.k = targetK || Math.max(view.k, 1); view.x = window.innerWidth/2 - c.x*view.k; view.y = window.innerHeight/2 - c.y*view.k;
  applyView();
}

// ---------- pan / zoom / drag ----------
let panning=false, panStart=null;
stage.addEventListener("pointerdown", function(e){
  if (e.target.closest(".node") || e.target.closest(".cont-title") || e.target.classList.contains("hit")) return;
  panning=true; stage.classList.add("grabbing");
  panStart={x:e.clientX-view.x, y:e.clientY-view.y}; stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", function(e){ if(!panning) return; view.x=e.clientX-panStart.x; view.y=e.clientY-panStart.y; applyView(); });
stage.addEventListener("pointerup", function(){ panning=false; stage.classList.remove("grabbing"); });
stage.addEventListener("wheel", function(e){
  e.preventDefault(); const f=e.deltaY<0?1.1:1/1.1, nk=Math.min(2.5,Math.max(0.15,view.k*f));
  view.x=e.clientX-(e.clientX-view.x)*(nk/view.k); view.y=e.clientY-(e.clientY-view.y)*(nk/view.k); view.k=nk; applyView();
}, {passive:false});

let drag=null;
function startDragNode(e, n){
  e.stopPropagation(); n._moved=false;
  drag={n:n, sx:e.clientX, sy:e.clientY, ox:n.x, oy:n.y};
  n._el.setPointerCapture(e.pointerId); n._el.style.cursor="grabbing";
  window.addEventListener("pointermove", onDragMove); window.addEventListener("pointerup", onDragEnd);
}
function onDragMove(e){
  if(!drag) return;
  const dx=(e.clientX-drag.sx)/view.k, dy=(e.clientY-drag.sy)/view.k;
  if (Math.abs(dx)+Math.abs(dy) > 2) drag.n._moved=true;
  drag.n.x=drag.ox+dx; drag.n.y=drag.oy+dy;
  drag.n._el.style.left=drag.n.x+"px"; drag.n._el.style.top=drag.n.y+"px";
  redraw();
}
function onDragEnd(){
  if(drag){ drag.n._el.style.cursor="grab"; saveLayout(); }
  drag=null; window.removeEventListener("pointermove", onDragMove); window.removeEventListener("pointerup", onDragEnd);
}

// Drag a whole container (category / script / region) by its title: moves every
// child node together so groups can be arranged. The title is recreated on each
// redraw, so we drive the drag from window listeners rather than pointer capture.
let cdrag=null;
function startDragContainer(e, c){
  e.stopPropagation();
  const starts = c.nodes.map(function(id){ const n=nodeByModelId(id); return n?{n:n, x:n.x, y:n.y}:null; })
                        .filter(function(s){ return s; });
  if (!starts.length) return;
  c._moved=false;
  cdrag={ c:c, sx:e.clientX, sy:e.clientY, starts:starts };
  document.body.style.cursor="grabbing";
  window.addEventListener("pointermove", onDragContainer); window.addEventListener("pointerup", onDragContainerEnd);
}
function onDragContainer(e){
  if(!cdrag) return;
  const dx=(e.clientX-cdrag.sx)/view.k, dy=(e.clientY-cdrag.sy)/view.k;
  if (Math.abs(dx)+Math.abs(dy) > 2) cdrag.c._moved=true;
  cdrag.starts.forEach(function(s){ s.n.x=s.x+dx; s.n.y=s.y+dy; s.n._el.style.left=s.n.x+"px"; s.n._el.style.top=s.n.y+"px"; });
  redraw();
}
function onDragContainerEnd(){
  if(cdrag && cdrag.c._moved) saveLayout();
  cdrag=null; document.body.style.cursor="";
  window.removeEventListener("pointermove", onDragContainer); window.removeEventListener("pointerup", onDragContainerEnd);
}

// ---------- detail panel ----------
const SECS = ["s-plain-wrap","s-stats-wrap","s-loc-wrap","s-members-wrap","s-sig-wrap","s-spec-wrap","s-code-wrap"];
function hideAllSecs(){ SECS.forEach(function(id){ document.getElementById(id).style.display="none"; }); }
function selectEl(el){ document.querySelectorAll(".node.sel").forEach(function(x){ x.classList.remove("sel"); }); if(el) el.classList.add("sel"); }
function openPanel(){ document.getElementById("side").classList.add("open"); }

function openCategory(cat){
  selectEl(null); hideAllSecs();
  document.getElementById("s-title").textContent = cat.label;
  document.getElementById("s-key").textContent = "category";
  toggleSec("s-plain-wrap", esc(cat.intent || cat.plain || "(no intent authored yet)"));
  const scs = scriptsByCat[cat.label] || [];
  let out=0, incoming=0;
  const ids = {}; scs.forEach(function(sc){ ids[sc.id]=1; });
  (DATA.edges||[]).forEach(function(e){
    const fromIn=ids[e.from], toIn=ids[e.to];
    if (fromIn && !toIn) out++; if (toIn && !fromIn) incoming++;
  });
  toggleSec("s-stats-wrap", row("Scripts", scs.length) + row("Depends on", out) + row("Depended on by", incoming));
  const dirs = {}; scs.forEach(function(sc){ dirs[sc.dir||"(root)"]=1; });
  toggleSec("s-loc-wrap", row("Folders", Object.keys(dirs).join(", ")) +
    '<div style="margin-top:6px"><span class="lk">Scripts</span></div>' +
    '<ul>'+scs.map(function(sc){ return '<li>'+esc(sc.label)+'</li>'; }).join("")+'</ul>');
  const sc = specClass(cat.spec || (DATA.spec&&DATA.spec.overallMatch));
  toggleSec("s-spec-wrap", '<span class="badge b-'+sc+'">'+esc(cat.spec||(DATA.spec&&DATA.spec.overallMatch)||"unknown")+'</span>'+
    (cat.specNote ? '<div class="k" style="margin-top:6px">'+esc(cat.specNote)+'</div>' :
      (DATA.spec&&DATA.spec.notes ? '<div class="k" style="margin-top:6px">'+esc(DATA.spec.notes)+'</div>' : "")));
  openPanel();
}

function openScript(n){
  const sc = n.model;
  const leaf = nodeByModelId(sc.id); selectEl(leaf ? leaf._el : null);
  hideAllSecs();
  document.getElementById("s-title").textContent = sc.label || sc.id;
  document.getElementById("s-key").textContent = [sc.kind, sc.lang].filter(Boolean).join("  \u2022  ");
  toggleSec("s-plain-wrap", esc(sc.plain || "(no explanation authored yet)"));
  const mems = sc.members || [];
  const fns = mems.filter(function(m){ return m.kind==="method"||m.kind==="function"; }).length;
  const flds = mems.filter(function(m){ return m.kind==="field"||m.kind==="param"; }).length;
  toggleSec("s-stats-wrap", row("Directory", sc.dir||"(root)") + row("Lines of code", sc.lines||"?") +
    row("Functions", fns) + row("Fields / params", flds));
  // clickable member breakdown -> focus in whiteboard
  if (mems.length){
    const html = '<ul class="members">' + mems.map(function(m){
      return '<li data-mid="'+esc(m.id)+'"><span class="mn">'+esc(m.name)+'</span>'+
        (m.type?' <span class="mt">'+esc(m.type)+'</span>':'')+
        ' <span class="mk">'+esc(m.kind)+'</span>'+
        (m.plain?'<span class="md">'+esc(m.plain)+'</span>':'')+'</li>';
    }).join("") + '</ul>';
    toggleSec("s-members-wrap", html);
    document.querySelectorAll("#s-members li").forEach(function(li){
      li.addEventListener("click", function(){ focusMember(li.getAttribute("data-mid")); });
    });
  }
  const spc = specClass(sc.spec);
  toggleSec("s-spec-wrap", '<span class="badge b-'+spc+'">'+esc(sc.spec||"unknown")+'</span>'+
    (sc.specNote ? '<div class="k" style="margin-top:6px">'+esc(sc.specNote)+'</div>' : ""));
  openPanel();
}

function openMember(m){
  const parent = memberParent[m.id];
  const leaf = nodeByModelId(m.id); selectEl(leaf ? leaf._el : null);
  selectedMemberId = m.id; drawEdges();
  hideAllSecs();
  document.getElementById("s-title").textContent = m.name || m.id;
  document.getElementById("s-key").textContent = [m.kind, parent?parent.label:""].filter(Boolean).join("  \u2022  ");
  toggleSec("s-plain-wrap", esc(m.plain || "(no description authored yet)"));
  toggleSec("s-stats-wrap", row("Type", m.type||m.kind) +
    row("Code lines", m.lineEnd ? (m.lineStart+"\u2013"+m.lineEnd) : String(m.lineStart||"?")) +
    row("Reference count", (m.refCount!=null?m.refCount:"?")) +
    row("Parent script", parent?parent.label:"?"));
  if (m.signature) toggleSec("s-sig-wrap", '<div class="sig">'+esc(m.signature)+'</div>');
  document.getElementById("s-code-wrap").querySelector("h3").textContent = "Code";
  toggleSec("s-code-wrap", renderSnippet(m.snippet, m.lineStart, [m.name]));
  openPanel();
}

function openEdge(e){
  selectEl(null); hideAllSecs();
  const a = scriptById[e.from], b = scriptById[e.to];
  document.getElementById("s-title").textContent = (a?a.label:e.from) + "  \u2192  " + (b?b.label:e.to);
  document.getElementById("s-key").textContent = "dependency" + (e.kind?"  \u2022  "+e.kind:"");
  const detail = (e.model && e.model.detail) ? e.model.detail :
    ((a?a.label:e.from) + (e.label?(" "+e.label+" "):" depends on ") + (b?b.label:e.to));
  toggleSec("s-plain-wrap", esc(detail));
  toggleSec("s-stats-wrap", row("From", a?a.label:e.from) + row("To", b?b.label:e.to) +
    row("Relationship", e.label||e.kind||"depends on"));
  openPanel();
}

// jump to a member from the script panel: switch to script view if needed, then
// select + center + open it.
function focusMember(mid){
  if (MODE !== "script"){ MODE="script"; sel.value="script"; try{localStorage.setItem(MODEKEY,MODE);}catch(_){}; render(); }
  const n = nodeByModelId(mid); if(!n) return;
  const m = memberById[mid]; if (m) openMember(m);
  focusNode(n, Math.max(view.k, 1.1));
}

document.getElementById("close").addEventListener("click", function(){
  document.getElementById("side").classList.remove("open"); selectEl(null);
  selectedMemberId=null; drawEdges();
});

// ---------- layout persistence (per mode) ----------
function posKey(){ return LSKEY + ":" + MODE + ":pos"; }
function saveLayout(){ const m={}; activeNodes.forEach(function(n){ m[n.id]={x:n.x,y:n.y}; });
  try { localStorage.setItem(posKey(), JSON.stringify(m)); } catch(_){} }
function loadLayout(){ try { return JSON.parse(localStorage.getItem(posKey())||"null"); } catch(_){ return null; } }
document.getElementById("reset").addEventListener("click", function(){
  try { localStorage.removeItem(posKey()); } catch(_){} render();
});

function switchMode(m){ if (m===MODE) return; MODE=m; try{localStorage.setItem(MODEKEY,MODE);}catch(_){}; render(); }

// ---------- go ----------
render();
</script>
